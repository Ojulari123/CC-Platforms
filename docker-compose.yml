services:
  postgres:
    image: postgres:16-alpine
    # CC_ prefix on the host side so nothing else on the machine (or another
    # project's shell exports) collides with these. Inside the container the
    # Postgres image still needs POSTGRES_USER/PASSWORD/DB — we remap here.
    environment:
      POSTGRES_USER: ${CC_POSTGRES_USER:-crescent}
      POSTGRES_PASSWORD: ${CC_POSTGRES_PASSWORD:-crescent}
      POSTGRES_DB: ${CC_POSTGRES_DB:-crescent}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CC_POSTGRES_USER:-crescent} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Browse the local databases at http://localhost:8080 (System: PostgreSQL,
  # Server: postgres, user/password from .env, Database: identity).
  # Dev convenience only — never expose this anywhere real.
  adminer:
    image: adminer:5
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  identity:
    build:
      context: ./services/identity
      dockerfile: Dockerfile
    env_file:
      - ./services/identity/.env
    # This OVERRIDES the DATABASE_URL in services/identity/.env — in Compose,
    # `environment:` beats `env_file:`. So in Docker, identity always talks to
    # the local sandbox Postgres above, never Neon. That's deliberate: dev is
    # where you break things. Comment this line out to run against the .env
    # (Neon) URL instead.
    environment:
      DATABASE_URL: postgresql+psycopg://${CC_POSTGRES_USER:-crescent}:${CC_POSTGRES_PASSWORD:-crescent}@postgres:5432/identity
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/identity:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000
             --reload --reload-dir app"

volumes:
  postgres_data:
