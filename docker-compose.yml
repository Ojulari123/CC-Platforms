services:
  postgres:
    # pgvector's image, not plain postgres: it is the same PG16 plus the `vector`
    # extension, which Pulse's repo index needs and stock postgres has no way to add.
    # Production (Neon) ships pgvector already.
    image: pgvector/pgvector:pg16
    # CC_ prefix on the host side so nothing else on the machine (or another
    # project's shell exports) collides with these. Inside the container the
    # Postgres image still needs POSTGRES_USER/PASSWORD/DB — we remap here.
    environment:
      POSTGRES_USER: ${CC_POSTGRES_USER:-crescent}
      POSTGRES_PASSWORD: ${CC_POSTGRES_PASSWORD:-crescent}
      POSTGRES_DB: ${CC_POSTGRES_DB:-crescent}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CC_POSTGRES_USER:-crescent} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Browse the local databases at http://localhost:8080 (System: PostgreSQL,
  # Server: postgres, user/password from .env, Database: identity).
  # Dev convenience only — never expose this anywhere real.
  adminer:
    image: adminer:5
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  identity:
    build:
      context: ./services/identity
      dockerfile: Dockerfile
    env_file:
      - ./services/identity/.env
    # This OVERRIDES the DATABASE_URL in services/identity/.env — in Compose,
    # `environment:` beats `env_file:`. So in Docker, identity always talks to
    # the local sandbox Postgres above, never Neon. That's deliberate: dev is
    # where you break things. Comment this line out to run against the .env
    # (Neon) URL instead.
    environment:
      DATABASE_URL: postgresql+psycopg://${CC_POSTGRES_USER:-crescent}:${CC_POSTGRES_PASSWORD:-crescent}@postgres:5432/identity
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/identity:/app
    # Exec form on purpose. The folded-scalar version of this kept the newline
    # before `--reload` (YAML `>` does not fold a more-indented line), so sh saw
    # the flags as a second command and uvicorn ran with no reloader at all.
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  pulse:
    # Build context is the repo ROOT (not services/pulse) so the image can pull
    # in the shared packages/core. See services/pulse/Dockerfile.
    build:
      context: .
      dockerfile: services/pulse/Dockerfile
    env_file:
      - ./services/pulse/.env
    # Same as identity: `environment:` beats `env_file:`, so in Docker Pulse
    # always talks to the local sandbox Postgres (its own `pulse` database), and
    # verifies tokens against identity's in-cluster JWKS URL.
    environment:
      DATABASE_URL: postgresql+psycopg://${CC_POSTGRES_USER:-crescent}:${CC_POSTGRES_PASSWORD:-crescent}@postgres:5432/pulse
      IDENTITY_JWKS_URL: http://identity:8000/.well-known/jwks.json
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./services/pulse:/app
      - ./packages/core:/packages/core
    # Exec form on purpose — same YAML folding trap as identity and forge.
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"]

  pulse-worker:
    # Runs the Celery jobs (the GitHub sync). Same image/env as pulse, different
    # command. Migrations are applied by the `pulse` service, not here.
    build:
      context: .
      dockerfile: services/pulse/Dockerfile
    env_file:
      - ./services/pulse/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${CC_POSTGRES_USER:-crescent}:${CC_POSTGRES_PASSWORD:-crescent}@postgres:5432/pulse
      IDENTITY_JWKS_URL: http://identity:8000/.well-known/jwks.json
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/pulse:/app
      - ./packages/core:/packages/core
    command: celery -A app.celery_app.celery worker --loglevel=info

  pulse-beat:
    # The scheduler ("beat"): drops the daily sync task onto the queue on time.
    build:
      context: .
      dockerfile: services/pulse/Dockerfile
    env_file:
      - ./services/pulse/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${CC_POSTGRES_USER:-crescent}:${CC_POSTGRES_PASSWORD:-crescent}@postgres:5432/pulse
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services/pulse:/app
      - ./packages/core:/packages/core
    command: celery -A app.celery_app.celery beat --loglevel=info

  forge:
    # Build context is the repo ROOT (not services/forge) so the image can pull
    # in the shared packages/core. See services/forge/Dockerfile. No worker/beat —
    # Forge has no background jobs yet; it uses Redis only for rate-limit counters.
    build:
      context: .
      dockerfile: services/forge/Dockerfile
    env_file:
      - ./services/forge/.env
    # Same as the others: `environment:` beats `env_file:`, so in Docker Forge
    # always talks to the local sandbox Postgres (its own `forge` database), and
    # verifies tokens against identity's in-cluster JWKS URL. IDENTITY_API_URL is
    # pinned here too so a standalone .env pointing at localhost can't break the
    # in-container call; the "forge" client id/secret come from the env_file.
    environment:
      DATABASE_URL: postgresql+psycopg://${CC_POSTGRES_USER:-crescent}:${CC_POSTGRES_PASSWORD:-crescent}@postgres:5432/forge
      IDENTITY_JWKS_URL: http://identity:8000/.well-known/jwks.json
      IDENTITY_API_URL: http://identity:8000
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./services/forge:/app
      - ./packages/core:/packages/core
    # Exec form on purpose. The folded-scalar version of this kept the newline
    # before `--reload` (YAML `>` does not fold a more-indented line), so sh saw
    # the flags as a second command and uvicorn ran with no reloader at all.
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"]

  # ---------------------------------------------------------------------------
  # The three Nuxt front ends.
  #
  # Ports are pinned and must not move: Forge 3000, Pulse 3001, identity 3002.
  # Those numbers are written into every service's CORS_ORIGINS and into the SSO
  # return-URL allowlist, so renaming a port here silently breaks sign-in.
  # Every image listens on 3000 internally (the way every API image listens on
  # 8000); the mapping below is what makes them 3000/3001/3002 on the host.
  #
  # Build context is the repo ROOT, because each app does
  # `extends: ["../../../packages/ui"]` — the shared Nuxt layer sits outside the
  # service directory, so a context rooted at services/*/frontend cannot see it.
  #
  # NUXT_PUBLIC_* below overrides runtimeConfig.public at container start, which
  # is what lets a deploy point these at real hostnames without editing
  # nuxt.config.ts. Note these are *public* config: the browser reads them, so
  # they must be addresses the browser can resolve. That is why they say
  # http://localhost:8001 and not http://identity:8000 — "identity" is a name on
  # the compose network that only the containers can resolve, and these calls are
  # made from the user's laptop, not from inside the container.
  #
  # authStoragePrefix is deliberately not set here. It namespaces the
  # localStorage token keys; changing it signs out every browser holding a
  # session for that product, so it stays pinned in nuxt.config.ts.
  # ---------------------------------------------------------------------------

  forge-web:
    build:
      context: .
      dockerfile: services/forge/frontend/Dockerfile
    environment:
      NUXT_PUBLIC_IDENTITY_URL: http://localhost:8001
      NUXT_PUBLIC_FORGE_URL: http://localhost:8003
      NUXT_PUBLIC_IDENTITY_WEB_URL: http://localhost:3002
      NUXT_PUBLIC_SSO_AUTHORIZE_URL: http://localhost:3002/sso/authorize
      NUXT_PUBLIC_SSO_RETURN_ALLOWLIST: http://localhost:3000/auth/callback
      # Where the theme cookie is written. Unset here on purpose: in dev the three
      # products are three ports on localhost and a cookie ignores the port, so one
      # host-only cookie already reaches all three. Set it to the parent domain
      # (".example.com") only when the products sit on different subdomains — see
      # DEPLOY.md.
      # NUXT_PUBLIC_THEME_COOKIE_DOMAIN: ""
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      forge:
        condition: service_started

  pulse-web:
    build:
      context: .
      dockerfile: services/pulse/frontend/Dockerfile
    environment:
      NUXT_PUBLIC_IDENTITY_URL: http://localhost:8001
      NUXT_PUBLIC_PULSE_URL: http://localhost:8002
      NUXT_PUBLIC_IDENTITY_WEB_URL: http://localhost:3002
      NUXT_PUBLIC_SSO_AUTHORIZE_URL: http://localhost:3002/sso/authorize
      NUXT_PUBLIC_SSO_RETURN_ALLOWLIST: http://localhost:3001/auth/callback
      # Where the theme cookie is written. Unset here on purpose: in dev the three
      # products are three ports on localhost and a cookie ignores the port, so one
      # host-only cookie already reaches all three. Set it to the parent domain
      # (".example.com") only when the products sit on different subdomains — see
      # DEPLOY.md.
      # NUXT_PUBLIC_THEME_COOKIE_DOMAIN: ""
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      pulse:
        condition: service_started

  identity-web:
    build:
      context: .
      dockerfile: services/identity/frontend/Dockerfile
    # The product picker on this app reads Pulse's and Forge's APIs for the
    # counts it shows, so it names all three APIs, not just identity's.
    environment:
      NUXT_PUBLIC_IDENTITY_URL: http://localhost:8001
      NUXT_PUBLIC_IDENTITY_WEB_URL: http://localhost:3002
      NUXT_PUBLIC_PULSE_URL: http://localhost:3001
      NUXT_PUBLIC_FORGE_URL: http://localhost:3000
      NUXT_PUBLIC_PULSE_API_URL: http://localhost:8002
      NUXT_PUBLIC_FORGE_API_URL: http://localhost:8003
      NUXT_PUBLIC_SSO_AUTHORIZE_URL: http://localhost:3002/sso/authorize
      NUXT_PUBLIC_SSO_RETURN_ALLOWLIST: http://localhost:3000/auth/callback,http://localhost:3001/auth/callback,http://localhost:3002/auth/callback
      # Where the theme cookie is written. Unset here on purpose: in dev the three
      # products are three ports on localhost and a cookie ignores the port, so one
      # host-only cookie already reaches all three. Set it to the parent domain
      # (".example.com") only when the products sit on different subdomains — see
      # DEPLOY.md.
      # NUXT_PUBLIC_THEME_COOKIE_DOMAIN: ""
    ports:
      - "3002:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      identity:
        condition: service_started

volumes:
  postgres_data:
