[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crescent-core"
version = "0.0.1"
description = "Shared backend helpers for Crescent products (Pulse, Forge). Never imports from any services/*."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.120",
    "python-jose[cryptography]>=3.3,<4.0",
    "httpx>=0.28,<1.0",
    "cryptography>=44.0,<46.0",
]

[project.optional-dependencies]
# Not a hard dependency: published_revocations imports redis lazily and returns None
# without it, which leaves a product on the identity HTTP lookup alone.
redis = ["redis>=5.0,<7.0"]
# types-python-jose is here rather than left to `ignore_missing_imports`, because that
# setting does not cover jose: typeshed publishes stubs for it, so mypy raises
# `import-untyped` and tells you to install them instead of staying quiet. Without the
# stubs installed, `mypy packages/core` from the repo root fails on verify.py:1 while the
# same check passes from inside this directory, which is a failure a developer cannot act
# on. With them installed both paths agree, and jose is genuinely typechecked.
dev = ["pytest>=8.3,<9.0", "redis>=5.0,<7.0", "mypy>=1.11,<3.0", "types-python-jose>=3.3,<4.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["crescent_core*"]

# Typechecked because this is the library every product verifies tokens with, and
# because it already passes: gating it costs nothing and stops the next change to it
# being the one that introduces a type hole. The services are not gated — see
# docs/backlog.md for what that would cost today.
[tool.mypy]
files = ["crescent_core"]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
