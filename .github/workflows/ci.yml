name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  identity:
    name: identity — install, import check, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/identity
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Import check (app boots at module level)
        env:
          DATABASE_URL: postgresql+psycopg://placeholder:placeholder@localhost:5432/placeholder
        run: python -c "import app.main"

      - name: Run tests (SQLite in-memory + ephemeral RSA keys, no external services)
        run: pytest -ra

  core:
    name: core — install, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (ephemeral RSA keys, no external services)
        run: pytest -ra

  migrations:
    name: migrations — apply from scratch on Postgres, check for drift
    runs-on: ubuntu-latest
    # The test suite builds its schema with create_all on SQLite, so the
    # migration chain is never exercised there. Without this job a broken
    # migration passes CI and only fails on deploy.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crescent
          POSTGRES_PASSWORD: crescent
          POSTGRES_DB: identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crescent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/identity
    env:
      DATABASE_URL: postgresql+psycopg://crescent:crescent@localhost:5432/identity
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply every migration to an empty database
        run: alembic upgrade head

      - name: Models and migrations must agree
        # An empty autogenerated migration means no drift. Anything else means
        # someone changed a model without writing the migration for it.
        run: |
          alembic revision --autogenerate -m drift_check -q
          generated=$(ls -t alembic/versions/*drift_check.py | head -1)
          if grep -qE "^\s+op\.(add|drop|alter|create)" "$generated"; then
            echo "::error::Models have drifted from migrations:"
            sed -n '/def upgrade/,/def downgrade/p' "$generated"
            exit 1
          fi
          echo "No drift."
          rm "$generated"

      - name: Downgrade all the way back, then re-apply
        # Proves the downgrade paths aren't fiction — worth knowing before a
        # rollback is needed under pressure.
        run: |
          alembic downgrade base
          alembic upgrade head

  contract:
    name: contract — identity's tokens verify in packages/core
    runs-on: ubuntu-latest
    # Each package's own suite mints its own fixture tokens, so a renamed claim
    # leaves both green and only breaks at runtime in a product. This is the
    # only job that runs identity's minter against core's verifier.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install both sides
        run: |
          python -m pip install --upgrade pip
          pip install -r services/identity/requirements-dev.txt
          pip install -e packages/core

      - name: Run contract tests
        run: pytest tests/contract -ra

  pulse:
    name: pulse — install, import check, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install shared core + pulse dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/core
          pip install -r services/pulse/requirements-dev.txt

      - name: Import check (app boots at module level)
        working-directory: services/pulse
        env:
          DATABASE_URL: postgresql+psycopg://placeholder:placeholder@localhost:5432/placeholder
        run: python -c "import app.main"

      - name: Run tests (SQLite in-memory, auth dependency overridden, no external services)
        working-directory: services/pulse
        run: pytest -ra

  pulse-migrations:
    name: pulse migrations — apply from scratch on Postgres, check for drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crescent
          POSTGRES_PASSWORD: crescent
          POSTGRES_DB: pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crescent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/pulse
    env:
      DATABASE_URL: postgresql+psycopg://crescent:crescent@localhost:5432/pulse
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install shared core + pulse deps
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/core
          pip install -r services/pulse/requirements.txt

      - name: Apply every migration to an empty database
        run: alembic upgrade head

      - name: Models and migrations must agree
        # An empty autogenerated migration means no drift. Anything else means
        # someone changed a model without writing the migration for it.
        run: |
          alembic revision --autogenerate -m drift_check
          generated=$(ls -t alembic/versions/*drift_check.py | head -1)
          if grep -qE "^\s+op\.(add|drop|alter|create|rename)" "$generated"; then
            echo "::error::Models have drifted from migrations:"
            sed -n '/def upgrade/,/def downgrade/p' "$generated"
            exit 1
          fi
          echo "No drift."
          rm "$generated"

      - name: Downgrade all the way back, then re-apply
        run: |
          alembic downgrade base
          alembic upgrade head
