name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  identity:
    name: identity — install, import check, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/identity
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Import check (app boots at module level)
        env:
          DATABASE_URL: postgresql+psycopg://placeholder:placeholder@localhost:5432/placeholder
        run: python -c "import app.main"

      - name: Run tests (SQLite in-memory + ephemeral RSA keys, no external services)
        run: pytest -ra
